<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="#0070D2"/>

  <!-- Cloud shape (white) built from overlapping circles + fill rect -->
  <circle cx="64" cy="50" r="26" fill="white"/>
  <circle cx="44" cy="66" r="22" fill="white"/>
  <circle cx="84" cy="66" r="22" fill="white"/>
  <rect x="22" y="60" width="84" height="30" rx="6" fill="white"/>

  <!-- Deploy arrow (blue on white cloud) -->
  <line x1="64" y1="40" x2="64" y2="68" stroke="#0070D2" stroke-width="9" stroke-linecap="round"/>
  <path d="M51 57 L64 70 L77 57" stroke="#0070D2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
